<!DOCTYPE html>
<html lang="en" style="background:#000000">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Page not found — PYRAXIS</title>
<link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
<link rel="stylesheet" href="/css/fonts.css">
<style>
  :root{--ink:#f0eee9;--mut:#a39db6;--pu2:#a78bff;--serif:'Instrument Serif',Georgia,serif;--sans:'Inter Tight',Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;color:var(--mut);font:400 17px/1.6 var(--sans);display:grid;place-items:center;padding:24px;text-align:center;-webkit-font-smoothing:antialiased}
  main{max-width:440px}
  p.k{font:500 11px/1 monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--pu2)}
  h1{font:400 clamp(2.6rem,9vw,4rem)/1 var(--serif);color:var(--ink);margin:20px 0 14px}
  h1 em{color:var(--pu2)}
  a.b{display:inline-block;margin-top:28px;padding:16px 26px;border-radius:2px;background:#f2efe9;color:#000;font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
  a.b:hover{background:#fff}
  a.b:focus-visible{outline:2px solid var(--pu2);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="k">Error 404</p>
  <h1>Page <em>not found.</em></h1>
  <p>That page does not exist or has moved. Head back to the start.</p>
  <a class="b" href="/">Back to PYRAXIS</a>
</main>
</body>
</html>
